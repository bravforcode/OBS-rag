": "obsidian_hotkeys", "community": 77, "norm_label": "hotkeys.json"}, {"label": "types.json", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L1", "id": "obsidian_types", "community": 3, "norm_label": "types.json"}, {"label": "types", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L2", "id": "obsidian_types_types", "community": 3, "norm_label": "types"}, {"label": "aliases", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L3", "id": "obsidian_types_types_aliases", "community": 3, "norm_label": "aliases"}, {"label": "cssclasses", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L4", "id": "obsidian_types_types_cssclasses", "community": 3, "norm_label": "cssclasses"}, {"label": "tags", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L5", "id": "obsidian_types_types_tags", "community": 3, "norm_label": "tags"}, {"label": "TQ_explain", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L6", "id": "obsidian_types_types_tq_explain", "community": 3, "norm_label": "tq_explain"}, {"label": "TQ_extra_instructions", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L7", "id": "obsidian_types_types_tq_extra_instructions", "community": 3, "norm_label": "tq_extra_instructions"}, {"label": "TQ_short_mode", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L8", "id": "obsidian_types_types_tq_short_mode", "community": 3, "norm_label": "tq_short_mode"}, {"label": "TQ_show_backlink", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L9", "id": "obsidian_types_types_tq_show_backlink", "community": 3, "norm_label": "tq_show_backlink"}, {"label": "TQ_show_cancelled_date", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L10", "id": "obsidian_types_types_tq_show_cancelled_date", "community": 3, "norm_label": "tq_show_cancelled_date"}, {"label": "TQ_show_created_date", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L11", "id": "obsidian_types_types_tq_show_created_date", "community": 3, "norm_label": "tq_show_created_date"}, {"label": "TQ_show_depends_on", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L12", "id": "obsidian_types_types_tq_show_depends_on", "community": 3, "norm_label": "tq_show_depends_on"}, {"label": "TQ_show_done_date", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L13", "id": "obsidian_types_types_tq_show_done_date", "community": 3, "norm_label": "tq_show_done_date"}, {"label": "TQ_show_due_date", "file_type": "code", "source_file": ".obsidian/types.json", "source_location": "L14", "id": "obsidian_types_types_tq_show_due_date", "community": 3, "norm_label": "tq_show_due_date"}];
const allEdges = [];

const colors = {code: '#e94560', doc: '#0f3460', folder: '#16213e', default: '#533483'};
let showLabels = true;
let scale = 1;
let offsetX = 0, offsetY = 0;
let dragging = null;
let lastMouse = {x: 0, y: 0};

// Initialize positions
const cx = canvas.width / 2;
const cy = canvas.height / 2;
allNodes.forEach((n, i) => {
    const angle = (i / allNodes.length) * Math.PI * 2;
    const r = 200 + Math.random() * 200;
    n.x = cx + Math.cos(angle) * r;
    n.y = cy + Math.sin(angle) * r;
    n.vx = 0; n.vy = 0;
});

// Force simulation
for (let iter = 0; iter < 80; iter++) {
    for (let i = 0; i < allNodes.length; i++) {
        for (let j = i + 1; j < allNodes.length; j++) {
            let dx = allNodes[j].x - allNodes[i].x;
            let dy = allNodes[j].y - allNodes[i].y;
            let d = Math.sqrt(dx*dx + dy*dy) || 1;
            let f = 300 / (d * d);
            allNodes[i].vx -= dx/d * f;
            allNodes[i].vy -= dy/d * f;
            allNodes[j].vx += dx/d * f;
            allNodes[j].vy += dy/d * f;
        }
    }
    allEdges.forEach(e => {
        let s = allNodes.find(n => n.id === e.source);
        let t = allNodes.find(n => n.id === e.target);
        if (s && t) {
            let dx = t.x - s.x;
            let dy = t.y - s.y;
            let d = Math.sqrt(dx*dx + dy*dy) || 1;
            let f = (d - 80) * 0.005;
            s.vx += dx/d * f; s.vy += dy/d * f;
            t.vx -= dx/d * f; t.vy -= dy/d * f;
        }
    });
    allNodes.forEach(n => {
        n.vx += (cx - n.x) * 0.0005;
        n.vy += (cy - n.y) * 0.0005;
        n.x += n.vx * 0.1; n.y += n.vy * 0.1;
        n.vx *= 0.9; n.vy *= 0.9;
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    allEdges.forEach(e => {
        let s = allNodes.find(n => n.id === e.source);
        let t = allNodes.find(n => n.id === e.target);
        if (s && t) {
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
        }
    });

    allNodes.forEach(n => {
        ctx.fillStyle = colors[n.type] || colors.default;
        ctx.beginPath();
        ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
        ctx.fill();
        if (showLabels && n.label) {
            ctx.fillStyle = '#aaa';
            ctx.font = '10px system-ui';
            ctx.fillText(n.label, n.x + 6, n.y + 3);
        }
    });
    ctx.restore();
    requestAnimationFrame(draw);
}
draw();

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoom = e.deltaY > 0 ? 0.9 : 1.1;
    scale *= zoom;
});

canvas.addEventListener('mousedown', e => {
    lastMouse = {x: e.clientX, y: e.clientY};
});

canvas.addEventListener('mousemove', e => {
    offsetX += e.clientX - lastMouse.x;
    offsetY += e.clientY - lastMouse.y;
    lastMouse = {x: e.clientX, y: e.clientY};
});

function resetView() { scale = 1; offsetX = 0; offsetY = 0; }
function toggleLabels() { showLabels = !showLabels; }
</script>
